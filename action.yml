name: 'Good Ole Automation Tools'
description: 'Installs jonpugh/goatscripts for improved operator experience.'
branding:
  color: green
  icon: zap
inputs:
  path:
    description: 'Path to install the scripts. Will be automatically included in the shell PATH.'
    default: '.goatscripts'

runs:
  using: "composite"
  steps:

    - uses: actions/checkout@v3
      with:
        repository: jonpugh/goatscripts
        ref: main
        path: ${{ inputs.path }}
    
    - name: Set path
      shell: bash
      env:
        SRC_PATH: ${{ inputs.path }}/src
      run: |
        echo "$GITHUB_WORKSPACE/$SRC_PATH" >> $GITHUB_PATH
